{% extends "base.html" %}

{% block content %}

<h2>Student List</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Name</th>
        <th>Roll Number</th>
        <th>Email</th>
        <th>Course</th>
        <th>Age</th>
        <th>Actions</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.roll_number }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.course }}</td>
        <td>{{ student.age }}</td>
        <td>
            <a href="{% url 'edit_student' student.id %}">Edit</a> |
            <a href="{% url 'delete_student' student.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
